name: refresh_universe

on:
  schedule:
    # Monthly on the first day (UTC; date is recorded in the output).
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Refresh universe
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY || secrets.LONGBRIDGE_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET || secrets.LONGBRIDGE_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN || secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: python scripts/refresh_universe.py
      - name: Commit refreshed universe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/universe_full_*.csv
          git diff --cached --quiet || git commit -m "Refresh universe $(date -u +%F)"
          git push
