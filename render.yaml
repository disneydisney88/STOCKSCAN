services:
  - type: cron
    name: stockscan-intraday
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    schedule: "*/5 * * * *"
    startCommand: python scripts/run_intraday.py --once
    envVars:
      - key: LONGPORT_APP_KEY
        sync: false
      - key: LONGPORT_APP_SECRET
        sync: false
      - key: LONGPORT_ACCESS_TOKEN
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
