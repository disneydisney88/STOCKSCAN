name: eod_scan

# 每個交易日 HKT 16:35 跑訊號 A（UTC 08:35）；Actions cron 慢 5–15 分鐘可接受
on:
  schedule:
    - cron: "35 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  eod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Ensure universe.csv
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY || secrets.LONGBRIDGE_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET || secrets.LONGBRIDGE_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN || secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: |
          if [ ! -f data/universe.csv ]; then python -m stockscan.universe; fi

      - name: Verify Longbridge secret presence
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY || secrets.LONGBRIDGE_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET || secrets.LONGBRIDGE_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN || secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: |
          missing=0
          for name in LONGPORT_APP_KEY LONGPORT_APP_SECRET LONGPORT_ACCESS_TOKEN; do
            if [ -n "${!name}" ]; then
              echo "$name present"
            else
              echo "$name missing"
              missing=1
            fi
          done
          test "$missing" -eq 0

      - name: Run EOD scan (訊號 A)
        env:
          LONGPORT_APP_KEY: ${{ secrets.LONGPORT_APP_KEY || secrets.LONGBRIDGE_APP_KEY }}
          LONGPORT_APP_SECRET: ${{ secrets.LONGPORT_APP_SECRET || secrets.LONGBRIDGE_APP_SECRET }}
          LONGPORT_ACCESS_TOKEN: ${{ secrets.LONGPORT_ACCESS_TOKEN || secrets.LONGBRIDGE_ACCESS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/run_eod.py --notify

      - name: Report event timing (M4)
        run: python scripts/report_go_timing.py

      - name: Fetch CCASS (M7, when secrets are configured)
        env:
          CCASS_API_URL: ${{ secrets.CCASS_API_URL }}
          CCASS_API_KEY: ${{ secrets.CCASS_API_KEY }}
        run: |
          if [ -n "$CCASS_API_URL" ] && [ -n "$CCASS_API_KEY" ]; then
            python scripts/run_ccass.py
          else
            echo "CCASS secrets not configured; skip M7 fetch."
          fi

      - name: Commit radar CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # P5 F1：rerun 舊 commit 會 non-fast-forward——push 前先 rebase 上最新 main
          git pull --rebase origin main
          git add data/eod data/reports data/universe.csv
          git diff --cached --quiet || git commit -m "EOD scan $(date -u '+%F_%H:%M UTC')"
          git push
